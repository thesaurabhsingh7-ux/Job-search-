name: Job Finder

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  find-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run scraper, scorer, and email digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SEARCH_LOCATION: ${{ secrets.SEARCH_LOCATION }}
          SEARCH_TITLES: ${{ secrets.SEARCH_TITLES }}
          MIN_SCORE: ${{ secrets.MIN_SCORE }}
        run: npm run run-once

      - name: Regenerate static dashboard
        run: npm run generate-dashboard

      - name: Commit updated data and dashboard
        run: |
          git config user.name "job-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json docs/index.html
          git diff --quiet --cached || git commit -m "Update job listings [automated]"
          git push
